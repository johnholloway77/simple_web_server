name: simple-server-ci

on:
  push:
  pull_request:

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libmagic-dev pkg-config libbsd-dev
          # Criterion: package name is libcriterion-dev on recent Ubuntu.
          # CONFIRM it exists on ubuntu-latest; if not, build from source.
          sudo apt-get install -y libcriterion-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm libmagic pkg-config criterion

      - name: Build
        run: make
        # macOS: 'gmake' exists only if you 'brew install make'. Homebrew
        # 'make' = gmake. OR just call 'make' on macOS+Linux (GNU make is
        # the system make on both). Only FreeBSD needs the gmake distinction.

      - name: Test
        run: make test-all

  build-test-freebsd:
    name: Build & Test (freebsd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cross-platform-actions/action@v0.27.0
        with:
          operating_system: freebsd
          version: "14.2" # the image that actually exists
          shell: bash
          run: |
            export IGNORE_OSVERSION=yes
            export ASSUME_ALWAYS_YES=yes
            sudo -E pkg update -f
            sudo -E pkg install -y gmake llvm pkgconf criterion
            gmake
            gmake test-all

  build-illumos:
    name: Build and smoke (4O4 Response expected) (illumos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/omnios-vm@v1
      - uses: vmactions/omnios-vm@v1
        with:
          usesh: true
          mem: 6144
          timeout: 120
          prepare: |
            pkg install developer/gcc14 developer/build/gnu-make file
          run: |
            gmake CC=gcc
            ./simple_server -p 8080 > /tmp/server.log 2>&1 &
            SERVER_PID=$!
            sleep 1
            cat /tmp/server.log
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 --connect-timeout 3 \
                http://127.0.0.1:8080/NULL_file.html)
            kill $SERVER_PID 2>/dev/null
            wait $SERVER_PID 2>/dev/null
            cat /tmp/server.log
            [ "$code" = "404" ] && echo "smoke OK" || (echo "smoke FAIL: got $code"; exit 1)

  # build-illumos:
