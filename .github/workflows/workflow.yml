  #           pkg install developer/gcc14 developer/build/gnu-make file
  #           # libmagic FMRI is uncertain on OmniOS — confirm real name:
  #           #   pkg search -r libmagic   (run on local OmniOS box)
  #           # then add it here, e.g. pkg install file/...
  #         run: |
  #           # gmake from gnu-make package; gcc from gcc14
  #           gmake CC=gcc
  #           ./simple_server -v -p 8080 &
  #           sleep 2
  #           curl -fsS http://127.0.0.1:8080/ >/dev/null && echo "smoke OK"

  docs:
    name: Documentation (Doxygen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
      - run: gmake docs # requires docs/Doxyfile committed to repo
